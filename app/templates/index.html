<!doctype html>
<!-- lang属性は言語切替時にJS側で差し替える（UI_function.txt 3-9節） -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictation - Pronunciation Check</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- data-i18n / data-i18n-placeholder は言語切替の目印。文言の正は UI_function.txt 3-9節の対訳表 -->
<div class="app">
  <header class="app-header">
    <h1 data-i18n="app.title">Dictation - Pronunciation Check</h1>
    <div class="lang-switch">
      <button type="button" class="lang-button" data-lang="en">English</button>
      <button type="button" class="lang-button" data-lang="ja">日本語</button>
    </div>
  </header>

  <section class="accent-select">
    <span class="label" data-i18n="accent.label">Accent:</span>
    <label><input type="radio" name="accent" value="us" checked> <span data-i18n="accent.us">US</span></label>
    <label><input type="radio" name="accent" value="uk"> <span data-i18n="accent.uk">UK</span></label>
    <label><input type="radio" name="accent" value="au"> <span data-i18n="accent.au">AU</span></label>
  </section>

  <section class="tabs">
    <div class="tab-buttons">
      <button class="tab-button active" data-tab="random" data-i18n="tab.random">Random</button>
      <button class="tab-button" data-tab="free" data-i18n="tab.free">Free Input</button>
    </div>

    <div class="tab-panel" data-panel="random">
      <span class="label" data-i18n="difficulty.label">Difficulty:</span>
      <!-- 表示はEasy/Medium/Hardだが、value（内部値）は変更しない。サーバーAPIとの互換のため（spec.txt 5-9節） -->
      <label><input type="radio" name="difficulty" value="beginner" checked> <span data-i18n="difficulty.beginner">Easy</span></label>
      <label><input type="radio" name="difficulty" value="intermediate"> <span data-i18n="difficulty.intermediate">Medium</span></label>
      <label><input type="radio" name="difficulty" value="advanced"> <span data-i18n="difficulty.advanced">Hard</span></label>
      <button id="btn-next-sentence" data-i18n="btn.nextSentence">Next Sentence</button>
    </div>

    <div class="tab-panel hidden" data-panel="free">
      <textarea id="free-input" rows="3" data-i18n-placeholder="free.placeholder" placeholder="Enter an English sentence to practice"></textarea>
      <button id="btn-use-free-text" data-i18n="btn.useFreeText">Use This Sentence</button>
    </div>
  </section>

  <section class="sentence-display">
    <div class="label" data-i18n="sentence.label">Sentence:</div>
    <div id="target-sentence" class="sentence-box"></div>
  </section>

  <section class="controls">
    <button id="btn-play-model" disabled data-i18n="btn.playModel">▶ Model</button>
    <!-- 録音ボタンは状態で文言が変わるため data-i18n を付けない。JS側で state.recordButtonKey から出し直す -->
    <button id="btn-record" disabled>● Record</button>
  </section>

  <div id="status-indicator" class="status hidden"></div>

  <section class="result hidden" id="result-section">
    <h2 data-i18n="result.heading">Result</h2>
    <div class="diff-row"><span class="diff-row-label" data-i18n="result.target">Target:</span><span id="diff-target"></span></div>
    <div class="diff-row"><span class="diff-row-label" data-i18n="result.said">You said:</span><span id="diff-said"></span></div>

    <div class="result-controls">
      <button id="btn-play-mine" disabled data-i18n="btn.playMine">▶ Your Recording</button>
    </div>
  </section>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
